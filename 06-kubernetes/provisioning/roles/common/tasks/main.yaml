---
- name: Install necessary packages
  apt:
    name: "{{ packages }}"
    state: present
    update_cache: yes
  vars:
    packages:
    - apt-transport-https
    - ca-certificates
    - curl
    - software-properties-common 
    - gnupg2
    - net-tools

- name: Remove swapfile from /etc/fstab
  mount:
    name: "{{ item }}"
    fstype: swap
    state: absent
  with_items:
    - swap
    - none

- name: Disable swap
  command: swapoff -a
  when: ansible_facts["swaptotal_mb"] > 0

- name: Install containerd
  apt: 
    name: "{{ packages }}"
    state: present
    update_cache: yes
  vars:
    packages:
    - containerd

- name: Configure containerd
  ansible.builtin.blockinfile:
    create: true
    path: /etc/modules-load.d/containerd.conf
    block: |
      overlay
      br_netfilter

- name: Enable kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Configure IP forwarding and iptables
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
  loop:
    - { name: "net.bridge.bridge-nf-call-iptables", value: 1 }
    - { name: "net.ipv4.ip_forward", value: 1 }

- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Kubernetes repository with signing key
  ansible.builtin.deb822_repository:
    name: kubernetes
    types: deb
    uris: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/"
    suites: /
    signed_by: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/Release.key"
    state: present
    install_python_debian: true

- name: Install Kubernetes binaries
  apt: 
    name: "{{ packages }}"
    state: present
    update_cache: yes
  vars:
    packages:
      - kubelet
      - kubeadm
      - kubectl

- name: "Hold Kubernetes binaries"
  ansible.builtin.dpkg_selections: 
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl

# This might change between ubuntu distributions
- ansible.builtin.set_fact:
    node_address: "{{ ansible_facts['eth1']['ipv4']['address'] }}"

- ansible.builtin.set_fact:
    node_prefix: "{{ ansible_facts['eth1']['ipv4']['prefix'] }}"

- name: Configure kubelet
  lineinfile:
    path: /lib/systemd/system/kubelet.service.d/10-kubeadm.conf
    line: Environment="KUBELET_EXTRA_ARGS=--node-ip={{ node_address }}/{{ node_prefix }}"
